# yaml-language-server: $schema=./pod-dispatcher.schema.json
id: castbox
name: Castbox
homepage: https://castbox.fm

source:
  hosts:
    - castbox.fm
  patterns:
    # Apple-id-keyed link: https://castbox.fm/vic/<appleID>
    - level: show
      path: '^/vic/(?<showId>\d+)/?$'
    # Native share links (castbox.fm/channel|episode/...-id<n>) use Castbox's
    # internal ids and are not intercepted in the app manifest.
  resolve:
    type: itunes-api
    params:
      id: '{showId}'

target:
  android:
    package: fm.castbox.audiobook.radio.podcast
  links:
    show:
      - 'https://castbox.fm/vic/{itunesId}'
    episode: []
  episodeFallback: show
