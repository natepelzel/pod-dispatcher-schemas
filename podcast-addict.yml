# yaml-language-server: $schema=./pod-dispatcher.schema.json
id: podcast-addict
name: Podcast Addict
homepage: https://podcastaddict.com

source:
  hosts:
    - podcastaddict.com
    - www.podcastaddict.com
  patterns:
    # Episode share link: https://podcastaddict.com/<show-slug>/episode/<id>
    # (the site also links the bare /episode/<id> form, which 301s to it).
    # \d+ keeps this clear of the legacy enclosure-URL-keyed episode links.
    - level: episode
      path: '^/(?:[^/]+/)?episode/(?<episodeId>\d+)/?$'
    # Show share link: https://podcastaddict.com/podcast/<slug>/<id>
    - level: show
      path: '^/podcast/[^/]+/\d+/?$'
  android:
    # /podcast pages plus slug-form episode pages. Deliberately NOT a bare
    # /episode prefix: our own outgoing episode deep link is
    # /episode/<enclosure-url> on this host and a path glob can't tell
    # digits from URLs — bare /episode/<id> links still work via redirect
    # or the share sheet.
    paths:
      - prefix: /podcast
      - pattern: '/.*/episode/.*'
  resolve:
    # Share pages carry the canonical feed in a standard alternate tag;
    # episode pages additionally expose the episode as JSON-LD.
    # Note: podcastaddict.com rejects bare library user agents; the engine
    # sends its own identifying UA, which is accepted.
    type: scrape
    feedUrl:
      - css: 'link[type="application/rss+xml"]'
        attr: href
    episodeUrl:
      - jsonld: 'associatedMedia.contentUrl'
    episodeTitle:
      - jsonld: 'name'

target:
  android:
    package: com.bambuna.podcastaddict
  links:
    show:
      # Opens the show's full detail page (verified app link, handled by
      # EpisodeSearchResultDetailActivity).
      - 'https://podcastaddict.com/feed/{feedUrl|urlencode}'
      # Fallback: custom scheme, opens the add-podcast dialog pre-filled.
      # Ref: https://github.com/nathangathright/podcast-platform-links/blob/main/schemes.md
      - 'podcastaddict://{feedUrl|strip-scheme}'
    episode:
      # Opens the episode page, keyed by the enclosure (audio) URL.
      # Ref: https://github.com/nathangathright/podcast-platform-links
      - 'https://podcastaddict.com/episode/{episodeUrl|urlencode}'
  episodeFallback: show
